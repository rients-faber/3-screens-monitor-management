name: Build DMG

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app and DMG
        run: |
          echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
          ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Schermbeheer-dmg
          path: build/*.dmg

      # Every push to main publishes (or updates) the release for the version in VERSION.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Schermbeheer ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: build/*.dmg
          body: |
            Download **Schermbeheer-${{ env.VERSION }}.dmg** below, open it and drag Schermbeheer to Applications.
            Download **Schermbeheer-${{ env.VERSION }}.dmg** hieronder, open hem en sleep Schermbeheer naar Programma's.

            First launch: the app is not notarized — see the README. / Eerste keer openen: zie de README.
